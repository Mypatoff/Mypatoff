<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-label="Davron - computer club tech support, self-taught developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b3a"/>
    </linearGradient>
    <clipPath id="c1"><rect class="r1" x="40" y="70" height="30" width="0"/></clipPath>
    <clipPath id="c2"><rect class="r2" x="40" y="110" height="30" width="0"/></clipPath>
    <clipPath id="c3"><rect class="r3" x="40" y="150" height="30" width="0"/></clipPath>
  </defs>
  <style>
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 18px; }
    .prompt { fill: #58a6ff; }
    .out { fill: #e6edf3; }
    .hl { fill: #7ee787; }
    .r1 { animation: t1 12s infinite; }
    .r2 { animation: t2 12s infinite; }
    .r3 { animation: t3 12s infinite; }
    .cur { fill: #7ee787; animation: blink 1s steps(1) infinite; }
    @keyframes t1 { 0% { width: 0; animation-timing-function: steps(8); } 6% { width: 88px; } 94% { width: 88px; } 100% { width: 0; } }
    @keyframes t2 { 0%, 7% { width: 0; animation-timing-function: steps(52); } 28% { width: 572px; } 94% { width: 572px; } 100% { width: 0; } }
    @keyframes t3 { 0%, 30% { width: 0; animation-timing-function: steps(57); } 55% { width: 620px; } 94% { width: 620px; } 100% { width: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="800" height="230" rx="14" fill="url(#bg)"/>
  <rect width="800" height="34" rx="14" fill="#21262d"/>
  <rect y="20" width="800" height="14" fill="#21262d"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="17" r="6" fill="#27c93f"/>
  <text x="400" y="22" text-anchor="middle" fill="#8b949e" style="font-size:12px">mypatoff@club: ~</text>

  <g clip-path="url(#c1)"><text x="40" y="92"><tspan class="prompt">$ </tspan><tspan class="out">whoami</tspan></text></g>
  <g clip-path="url(#c2)"><text x="40" y="132" class="hl">Davron - computer club tech support, self-taught dev</text></g>
  <g clip-path="url(#c3)"><text x="40" y="172"><tspan class="prompt">$ </tspan><tspan class="out">now building: </tspan><tspan class="hl">ClubControl for Windows 11</tspan></text></g>
  <rect class="cur" x="40" y="195" width="11" height="3"/>
</svg>
