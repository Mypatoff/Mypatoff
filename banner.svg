<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-label="Davron - computer club tech support, self-taught developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38e8ff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="c1"><rect class="r1" x="40" y="74" height="30" width="88"/></clipPath>
    <clipPath id="c2"><rect class="r2" x="40" y="114" height="30" width="572"/></clipPath>
    <clipPath id="c3"><rect class="r3" x="40" y="154" height="30" width="460"/></clipPath>
  </defs>
  <style>
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 18px; }
    .label { fill: #38e8ff; font-size: 12px; letter-spacing: 2px; }
    .prompt { fill: #38e8ff; }
    .out { fill: #e6edf3; }
    .hl { fill: #7ee787; }
    .bracket { fill: none; stroke: #38e8ff; stroke-width: 2.5; stroke-linecap: square; }
    .track { fill: #38e8ff; fill-opacity: .12; }
    .fill { fill: #38e8ff; transform-box: fill-box; transform-origin: left center; animation: load 12s linear infinite; }
    .r1 { animation: t1 12s infinite; }
    .r2 { animation: t2 12s infinite; }
    .r3 { animation: t3 12s infinite; }
    .cur { fill: #7ee787; animation: blink 1s steps(1) infinite; }
    @keyframes t1 { 0% { width: 0; animation-timing-function: steps(8); } 6% { width: 88px; } 94% { width: 88px; } 100% { width: 0; } }
    @keyframes t2 { 0%, 7% { width: 0; animation-timing-function: steps(52); } 28% { width: 572px; } 94% { width: 572px; } 100% { width: 0; } }
    @keyframes t3 { 0%, 30% { width: 0; animation-timing-function: steps(42); } 55% { width: 460px; } 94% { width: 460px; } 100% { width: 0; } }
    @keyframes load { 0% { transform: scaleX(0); } 94% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="800" height="230" fill="url(#bg)"/>
  <rect width="800" height="230" fill="url(#grid)"/>
  <rect x="10" y="10" width="780" height="210" fill="none" stroke="#38e8ff" stroke-opacity=".18"/>

  <!-- HUD corner brackets -->
  <path class="bracket" d="M10 34V10H34"/>
  <path class="bracket" d="M766 10H790V34"/>
  <path class="bracket" d="M10 196V220H34"/>
  <path class="bracket" d="M766 220H790V196"/>

  <text x="40" y="44" class="label">// MYPATOFF . CLUB</text>
  <text x="760" y="44" text-anchor="end" class="label">ONLINE</text>
  <circle cx="772" cy="39" r="4" fill="#7ee787"/>

  <g clip-path="url(#c1)"><text x="40" y="96"><tspan class="prompt">&gt;</tspan><tspan class="out" dx="11">whoami</tspan></text></g>
  <g clip-path="url(#c2)"><text x="40" y="136" class="hl">Davron - computer club tech support, self-taught dev</text></g>
  <g clip-path="url(#c3)"><text x="40" y="176"><tspan class="prompt">&gt;</tspan><tspan class="out" dx="11">now building:</tspan><tspan class="hl" dx="11">ClubControl for Windows 11</tspan></text></g>
  <rect class="cur" x="40" y="190" width="11" height="3"/>

  <rect class="track" x="40" y="206" width="720" height="3"/>
  <rect class="fill" x="40" y="206" width="720" height="3"/>
</svg>
