<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="t d">
<title id="t">Davron (Mypatoff) - computer club tech support, self-taught developer</title>
<desc id="d">5 years of tech support for computer clubs, 2-3 years of daily Linux and Windows. Speaks Uzbek (native), English (C1), Russian (B2). Comfortable with Go, HTML, CSS; learning Rust; basics of Python and C#. Projects: ClubControl, TimeTable, screentime, wasteless, online-shop-management. Builds with AI (Claude Code) as a coding partner.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#16193d"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <clipPath id="clipType"><rect class="typing" x="716" y="52" height="26" width="222"/></clipPath>
  <clipPath id="card"><rect width="1000" height="710" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
  .name { font-size: 58px; font-weight: 800; fill: url(#name); letter-spacing: -1px; }
  .tag { font-size: 20px; fill: #c9d1d9; }
  .handle { font-size: 14px; fill: #8b949e; }
  .panel { fill: #ffffff; fill-opacity: .045; stroke: #ffffff; stroke-opacity: .1; }
  .ptitle { font-size: 15px; font-weight: 700; fill: #e6edf3; letter-spacing: .3px; }
  .big { font-size: 32px; font-weight: 800; fill: #e6edf3; }
  .lbl { font-size: 12.5px; fill: #8b949e; }
  .row { font-size: 14px; fill: #e6edf3; font-weight: 600; }
  .lvl { font-size: 12.5px; fill: #8b949e; }
  .sub { font-size: 11px; fill: #8b949e; letter-spacing: 1px; text-transform: uppercase; }
  .pname { font-size: 13.5px; font-weight: 700; fill: #e6edf3; }
  .pdesc { font-size: 12px; fill: #8b949e; }
  .plang { font-size: 11px; fill: #58a6ff; }
  .chip { font-size: 12.5px; font-weight: 600; }
  .ach { font-size: 13.5px; fill: #e6edf3; }
  .note { font-size: 13px; fill: #8b949e; }
  .term { font-size: 14px; fill: #7ee787; }
  .track { fill: #ffffff; fill-opacity: .09; }
  .fade { animation: up .9s ease-out backwards; animation-delay: var(--d, 0s); }
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.3s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: var(--d, 0s); }
  .glow1 { animation: drift1 16s ease-in-out infinite alternate; }
  .glow2 { animation: drift2 19s ease-in-out infinite alternate; }
  .typing { animation: type 9s infinite; }
  .cur { fill: #7ee787; transform: translateX(220px); animation: blink 1s steps(1) infinite, curmove 9s infinite; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes drift1 { to { transform: translate(160px, 70px); } }
  @keyframes drift2 { to { transform: translate(-190px, -60px); } }
  @keyframes type { 0% { width: 0; animation-timing-function: steps(25); } 35% { width: 222px; } 92% { width: 222px; } 100% { width: 0; } }
  @keyframes curmove { 0% { transform: translateX(0); animation-timing-function: steps(26); } 35% { transform: translateX(220px); } 100% { transform: translateX(220px); } }
  @keyframes blink { 50% { opacity: 0; } }
</style>

